[package]
name = "release"
version = "0.1.0"
authors = ["Gregory Szorc <gregory.szorc@gmail.com>"]
edition = "2021"
description = "Performs a release of PyOxidizer"
license = "MPL-2.0"
homepage = "https://github.com/indygreg/PyOxidizer"
repository = "https://github.com/indygreg/PyOxidizer.git"

[package.metadata.release]
# Internal package is never released.
release = false

[dependencies]
anyhow = "1.0.102"
cargo-lock = "10.0.1"
cargo_toml = "0.20.5"
clap = "4.6.1"
duct = "0.13.7"
# We don't need network functionality.
# Note: 0.20.1+ is required for Windows advapi32 linking fix (rust-lang/git2-rs#1143)
git2 = { version = "0.20.2", default-features = false }
once_cell = "1.21.4"
pulldown-cmark = "0.12.2"
rustdoc-types = "0.32.2"
semver = "1.0.23"
serde_json = "1.0.150"
tempfile = "3.27.0"
toml = "0.8.23"
url = "2.5.2"
